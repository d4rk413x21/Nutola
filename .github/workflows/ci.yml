name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Optional developer preview for any selected branch: not built on every PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: xcode-27
    env:
      # Pin the stable toolchain: the image also contains release candidates.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect packaging changes
        id: packaging
        run: |
          if git diff --quiet HEAD^ HEAD -- Makefile Package.swift Package.resolved packaging/ Sources/Nutola/App/AppIdentity.swift .github/workflows/ci.yml .github/workflows/release.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore SwiftPM cache
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-v3-${{ runner.os }}-${{ runner.arch }}-xcode27.1-debug-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: spm-v3-${{ runner.os }}-${{ runner.arch }}-xcode27.1-debug-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: swift --version && xcodebuild -version
      - name: Build and test
        run: swift test --disable-xctest
      - name: Save SwiftPM cache
        if: ${{ always() && !cancelled() && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      # Model-dependent paths (FoundationModels, SpeechAnalyzer assets) are
      # unavailable on hosted runners; tests cover only pure logic by design.
      # Package only when build metadata changes or a preview is requested manually.
      - name: Assemble and verify preview app
        if: github.event_name == 'workflow_dispatch' || steps.packaging.outputs.changed == 'true'
        run: make app

      - name: Zip preview app
        if: github.event_name == 'workflow_dispatch' || steps.packaging.outputs.changed == 'true'
        run: ditto -c -k --keepParent dist/Nutola.app dist/Nutola.zip

      - name: Upload preview artifact
        if: github.event_name == 'workflow_dispatch' || steps.packaging.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Nutola-preview
          path: dist/Nutola.zip
          if-no-files-found: error
          retention-days: 7
