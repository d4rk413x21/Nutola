name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Optional developer preview for any selected branch: not built on every PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    env:
      # The image's default is Xcode 26.5; match the SDK the project targets.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Restore SwiftPM cache
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.6-debug-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: spm-v2-${{ runner.os }}-${{ runner.arch }}-xcode26.6-debug-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: swift --version && xcodebuild -version
      - name: Build and test
        run: swift test
      - name: Save SwiftPM cache
        if: ${{ always() && !cancelled() && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      # Model-dependent paths (FoundationModels, SpeechAnalyzer assets) are
      # unavailable on hosted runners; tests cover only pure logic by design.
      # Build a temporary, ad-hoc-signed .app only when this workflow is
      # started explicitly from Actions -> CI -> Run workflow on a branch.
      # Pushes and pull requests still run compile + tests without packaging.
      - name: Assemble preview app (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: make app

      - name: Zip preview app (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: ditto -c -k --keepParent dist/Nutola.app dist/Nutola.zip

      - name: Upload preview artifact (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Nutola-preview
          path: dist/Nutola.zip
          if-no-files-found: error
          retention-days: 7
