name: Release app

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag and set bundle version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag like v1.2.3 or 1.2.3: $RELEASE_TAG" >&2
            exit 1
          fi
          printf '%s\n' "${RELEASE_TAG#v}" > VERSION

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-v3-${{ runner.os }}-${{ runner.arch }}-xcode27.1-release-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Makefile', 'packaging/**') }}
          restore-keys: spm-v3-${{ runner.os }}-${{ runner.arch }}-xcode27.1-release-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Toolchain versions
        run: swift --version && xcodebuild -version

      - name: Build release app
        run: make app

      - name: Zip app bundle
        run: ditto -c -k --keepParent dist/Nutola.app dist/Nutola.zip

      - name: Attach build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/Nutola.zip --clobber
